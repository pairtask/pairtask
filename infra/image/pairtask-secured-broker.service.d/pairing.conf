# The opt-in pairing route (#178). Without the route mounts the setup unit is
# skipped, no settings file exists and the broker runs as before; with them, a
# failed setup keeps the broker from starting without its route.
[Unit]
Requires=pairtask-pairing-setup.service
After=pairtask-pairing-setup.service

[Service]
# As broker on every start, crash restarts included: only its own stale
# pairing socket; without the route mount it does nothing.
ExecStartPre=/usr/local/lib/pairtask/pairtask-pairing-setup clean-ingress
EnvironmentFile=-/run/pairtask/pairing.env
SupplementaryGroups=collab-peer
ReadWritePaths=-/mnt/pairtask-pairing
