<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1600 900" role="img" aria-labelledby="title">
<title id="title">Agents on your host</title><defs>
<marker id="you" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#008080"/></marker>
<marker id="you-start" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12 0 L0 6 L12 12 Z" fill="#008080"/></marker>
<marker id="session" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#B65C13"/></marker>
<marker id="session-start" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12 0 L0 6 L12 12 Z" fill="#B65C13"/></marker>
<marker id="message" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#58A824"/></marker>
<marker id="message-start" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12 0 L0 6 L12 12 Z" fill="#58A824"/></marker>
<marker id="storage" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L12 6 L0 12 Z" fill="#4B0082"/></marker>
<marker id="storage-start" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M12 0 L0 6 L12 12 Z" fill="#4B0082"/></marker>
</defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20252B}.title{font-size:38px;font-weight:700}.heading{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:19px;fill:#4D555E}.label{font-size:21px;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1600" height="900" fill="white"/>
<text x="40" y="58" class="title" text-anchor="start">Agents on your host</text>
<text x="40" y="98" class="body" text-anchor="start">Three ways an agent reaches the broker</text>
<rect x="620" y="118" width="360" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="642" y="158" class="heading" text-anchor="start">You</text>
<text x="642" y="194" class="body" text-anchor="start">a terminal per agent</text>
<rect x="55" y="260" width="490" height="325" rx="4" fill="white" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<text x="80" y="299" class="heading" text-anchor="start">Managed Codex</text>
<text x="80" y="329" class="small" text-anchor="start">listens while it runs</text>
<rect x="80" y="335" width="440" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="102" y="375" class="heading" text-anchor="start">Codex terminal UI</text>
<text x="102" y="411" class="body" text-anchor="start">you prompt and approve</text>
<rect x="80" y="470" width="440" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="102" y="510" class="heading" text-anchor="start">pairtask-codex</text>
<text x="102" y="546" class="body" text-anchor="start">proxy, listener, App Server</text>
<path d="M300 425 V470" fill="none" stroke="#B65C13" stroke-width="3.5" marker-end="url(#session)" marker-start="url(#session-start)"/>
<text x="320" y="455" class="label" text-anchor="start">private socket</text>
<rect x="575" y="260" width="450" height="325" rx="4" fill="white" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<text x="600" y="299" class="heading" text-anchor="start">Claude channel</text>
<text x="600" y="329" class="small" text-anchor="start">listens while it runs</text>
<rect x="600" y="335" width="400" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="622" y="375" class="heading" text-anchor="start">Claude Code</text>
<text x="622" y="411" class="body" text-anchor="start">channel opt-in, org policy</text>
<rect x="600" y="470" width="400" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="622" y="510" class="heading" text-anchor="start">pairtask-mcp</text>
<text x="622" y="546" class="body" text-anchor="start">--claude-channel --auto-listen</text>
<path d="M800 425 V470" fill="none" stroke="#B65C13" stroke-width="3.5" marker-end="url(#session)" marker-start="url(#session-start)"/>
<text x="820" y="455" class="label" text-anchor="start">MCP · stdio</text>
<rect x="1055" y="260" width="490" height="325" rx="4" fill="white" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1080" y="299" class="heading" text-anchor="start">Plain MCP</text>
<text x="1080" y="329" class="small" text-anchor="start">checks its inbox when asked</text>
<rect x="1080" y="335" width="440" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="1102" y="375" class="heading" text-anchor="start">Codex or Claude Code</text>
<text x="1102" y="411" class="body" text-anchor="start">any MCP client</text>
<rect x="1080" y="470" width="440" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="1102" y="510" class="heading" text-anchor="start">pairtask-mcp</text>
<text x="1102" y="546" class="body" text-anchor="start">default mode</text>
<path d="M1300 425 V470" fill="none" stroke="#B65C13" stroke-width="3.5" marker-end="url(#session)" marker-start="url(#session-start)"/>
<text x="1320" y="455" class="label" text-anchor="start">MCP · stdio</text>
<path d="M900 208 V335" fill="none" stroke="#008080" stroke-width="3.5" marker-end="url(#you)"/>
<path d="M620 163 H420 V335" fill="none" stroke="#008080" stroke-width="3.5" marker-end="url(#you)"/>
<path d="M980 163 H1420 V335" fill="none" stroke="#008080" stroke-width="3.5" marker-end="url(#you)"/>
<text x="920" y="244" class="label" text-anchor="start">launch, prompt, approve</text>
<rect x="620" y="610" width="360" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="642" y="650" class="heading" text-anchor="start">Broker socket</text>
<text x="642" y="686" class="body" text-anchor="start">/tmp/collab-ai.sock</text>
<path d="M800 560 V610" fill="none" stroke="#58A824" stroke-width="3.5" marker-end="url(#message)"/>
<path d="M300 560 V655 H620" fill="none" stroke="#58A824" stroke-width="3.5" marker-end="url(#message)"/>
<path d="M1300 560 V655 H980" fill="none" stroke="#58A824" stroke-width="3.5" marker-end="url(#message)"/>
<text x="460" y="643" class="label" text-anchor="middle">broker protocol</text>
<rect x="620" y="735" width="360" height="90" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="642" y="775" class="heading" text-anchor="start">Broker</text>
<text x="642" y="811" class="body" text-anchor="start">one owner per inbox</text>
<path d="M800 700 V735" fill="none" stroke="#58A824" stroke-width="3.5" marker-end="url(#message)"/>
<path d="M1040 744 A150.0 14 0 0 1 1340 744 V816 A150.0 14 0 0 1 1040 816 Z" fill="#90EE90" stroke="#888888" stroke-width="2"/>
<ellipse cx="1190.0" cy="744" rx="150.0" ry="14" fill="#90EE90" stroke="#888888" stroke-width="2"/>
<text x="1062" y="778" class="heading" text-anchor="start">SQLite</text>
<text x="1062" y="810" class="body" text-anchor="start">messages, receipts</text>
<path d="M980 780 H1040" fill="none" stroke="#4B0082" stroke-width="3.5" marker-end="url(#storage)"/>
<path d="M960 91 H1000" fill="none" stroke="#008080" stroke-width="3.5" marker-end="url(#you)"/>
<text x="1012" y="98" class="small" text-anchor="start">you</text>
<path d="M1078 91 H1118" fill="none" stroke="#B65C13" stroke-width="3.5" marker-end="url(#session)"/>
<text x="1130" y="98" class="small" text-anchor="start">agent and adapter</text>
<path d="M1336 91 H1376" fill="none" stroke="#58A824" stroke-width="3.5" marker-end="url(#message)"/>
<text x="1388" y="98" class="small" text-anchor="start">broker protocol</text>
<text x="40" y="866" class="small" text-anchor="start">Managed Codex and the Claude channel deliver messages while their process runs; plain MCP sees them only when the agent calls a tool.</text>
<text x="40" y="892" class="small" text-anchor="start">Each agent has its own durable inbox. pairtask status and pairtask dashboard read the same socket, read-only.</text>
</svg>
