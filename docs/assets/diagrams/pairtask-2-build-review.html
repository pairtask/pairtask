<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Layout: one 16:9 slide, left-to-right flow with a rework loop below and a guardrail band at the foot */
  :root {
    --bg: #F6F6F4;
    --slide: #FFFFFF;
    --surface: #FFFFFF;
    --ink: #2E353B;
    --muted: #6B747D;
    --line: #C9CED2;
    --accent: #0E9F6E;
    --accent-soft: #E3F4EC;
    --warn: #B4620A;
    --warn-soft: #FBEEDD;
    --op-bg: #2E353B;
    --op-fg: #F6F6F4;
    --op-muted: #B9BFC4;
    --band: #F1F3F2;
    --lane: #F6F8F7;
    --font-sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161A1D; --slide: #1E2327; --surface: #262C31; --ink: #F3F4F1; --muted: #9AA2AA;
      --line: #3B4349; --accent: #34C08F; --accent-soft: #173A2E; --warn: #E3A046; --warn-soft: #3A2C17;
      --op-bg: #F3F4F1; --op-fg: #1E2327; --op-muted: #5B646D; --band: #232A2F; --lane: #222A2E; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #161A1D; --slide: #1E2327; --surface: #262C31; --ink: #F3F4F1; --muted: #9AA2AA;
    --line: #3B4349; --accent: #34C08F; --accent-soft: #173A2E; --warn: #E3A046; --warn-soft: #3A2C17;
    --op-bg: #F3F4F1; --op-fg: #1E2327; --op-muted: #5B646D; --band: #232A2F; --lane: #222A2E; color-scheme: dark;
  }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font-sans);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  .frame { max-width: 1440px; margin: 0 auto; overflow-x: auto; display: grid; gap: 32px; }
  .lane { fill: var(--lane); }
  .sep { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 5; }
  .lead-fill { fill: var(--accent-soft); }
  .bb { font-size: 15.5px; }
  svg.slide { display: block; width: 100%; min-width: 880px; height: auto; border-radius: 6px; }
  .sl-bg { fill: var(--slide); }
  .card { fill: var(--surface); stroke: var(--line); stroke-width: 1.5; }
  .card-dash { fill: var(--surface); stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 6 5; }
  .op { fill: var(--op-bg); }
  .band { fill: var(--band); }
  text { font-family: var(--font-sans); fill: var(--ink); }
  .eyebrow { font-size: 13px; font-weight: 600; letter-spacing: 0.12em; fill: var(--muted); }
  .title { font-size: 40px; font-weight: 600; letter-spacing: -0.01em; }
  .sub { font-size: 19px; fill: var(--muted); }
  .h { font-size: 24px; font-weight: 600; }
  .hm { font-family: var(--font-mono); font-size: 24px; font-weight: 500; }
  .b { font-size: 16.5px; }
  .m { font-family: var(--font-mono); font-size: 14.5px; fill: var(--muted); }
  .ch { font-size: 17px; font-weight: 600; }
  .cb { font-size: 14.5px; fill: var(--muted); }
  .on-op { fill: var(--op-fg); }
  .on-op-muted { fill: var(--op-muted); }
  .num-c { fill: var(--accent); }
  .num-t { font-size: 15px; font-weight: 600; fill: var(--slide); text-anchor: middle; }
  .num-op { fill: var(--op-fg); }
  .num-op-t { font-size: 15px; font-weight: 600; fill: var(--op-bg); text-anchor: middle; }
  .dot { fill: var(--accent); }
  .flow { stroke: var(--accent); stroke-width: 2.5; fill: none; }
  .loop { stroke: var(--warn); stroke-width: 2.5; fill: none; stroke-dasharray: 8 6; }
  .head-a { fill: var(--accent); }
  .head-w { fill: var(--warn); }
  .pill-ok { fill: var(--accent-soft); }
  .pill-ok-t { font-family: var(--font-mono); font-size: 14.5px; font-weight: 500; fill: var(--accent); }
  .pill-w { fill: var(--warn-soft); }
  .pill-w-t { font-family: var(--font-mono); font-size: 14.5px; font-weight: 500; fill: var(--warn); }
  .warn-t { font-family: var(--font-mono); font-size: 15px; font-weight: 500; fill: var(--warn); }
  .ok-t { font-family: var(--font-mono); font-size: 15px; font-weight: 500; fill: var(--accent); }
  .icon { stroke: var(--accent); stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .icon-op { stroke: var(--op-fg); stroke-width: 2; fill: none; stroke-linecap: round; }
  .mid { text-anchor: middle; }
</style>

<style>html,body{margin:0;padding:0!important;background:#fff}svg.slide{min-width:0;width:1600px;border-radius:0}</style></head><body><svg class="slide" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="t d">
  <title id="t">Two-agent build and review workflow in pairtask</title>
  <desc id="d">The developer assigns a task. A builder agent implements it in a sandbox, runs lint, code health and CVE scans and hands off an exact commit through an offline broker. A reviewer agent on a different model reviews that pinned commit and reports READY or BLOCKED. BLOCKED loops back to the builder for a fix and focused recheck. READY goes to the developer, who alone authorizes the merge. Guardrails apply at every step.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-a" d="M0 0 L10 5 L0 10 z"/></marker>
    <marker id="aw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head-w" d="M0 0 L10 5 L0 10 z"/></marker>
  </defs>

  <rect class="sl-bg" x="0" y="0" width="1600" height="900"/>

  <text class="eyebrow" x="60" y="72">PAIRTASK · BUILD AND REVIEW</text>
  <text class="title" x="60" y="122">One agent builds, another reviews, developer decides</text>
  <text class="sub" x="60" y="158">Two different models check each other's work inside guardrails. The developer keeps the final say.</text>

  <!-- 1 Operator -->
  <rect class="op" x="60" y="230" width="190" height="290" rx="10"/>
  <circle class="num-op" cx="88" cy="258" r="14"/><text class="num-op-t" x="88" y="263">1</text>
  <circle class="icon-op" cx="155" cy="300" r="11"/>
  <path class="icon-op" d="M133 334 a22 18 0 0 1 44 0"/>
  <text class="eyebrow on-op-muted" x="80" y="378">HUMAN</text>
  <text class="h on-op" x="80" y="406">Developer</text>
  <text class="b on-op-muted" x="80" y="438">Assigns the task</text>
  <text class="b on-op-muted" x="80" y="462">Sets scope, limits</text>
  <text class="b on-op-muted" x="80" y="486">and what to share</text>

  <line class="flow" x1="250" y1="375" x2="306" y2="375" marker-end="url(#ah)"/>

  <!-- 2 Builder -->
  <rect class="card" x="310" y="230" width="330" height="290" rx="10"/>
  <circle class="num-c" cx="338" cy="258" r="14"/><text class="num-t" x="338" y="263">2</text>
  <text class="eyebrow" x="362" y="263">AGENT 1 · BUILDER</text>
  <text class="hm" x="334" y="314">claude-1</text>
  <circle class="dot" cx="340" cy="356" r="4"/><text class="b" x="356" y="362">Implements on a branch</text>
  <circle class="dot" cx="340" cy="392" r="4"/><text class="b" x="356" y="398">Runs lint, code health and CVE scans</text>
  <circle class="dot" cx="340" cy="428" r="4"/><text class="b" x="356" y="434">Hands off the exact commit</text>
  <text class="m" x="334" y="492">sandbox container</text>

  <!-- Handoff + broker -->
  <text class="eyebrow mid" x="800" y="236">3 · HANDOFF</text>
  <text class="m mid" x="800" y="260">sha · changes · checks · risks</text>
  <rect class="card-dash" x="690" y="285" width="220" height="180" rx="10"/>
  <text class="eyebrow" x="712" y="318">BROKER</text>
  <text class="b" x="712" y="350">Durable delivery</text>
  <text class="b" x="712" y="376">Tags every message</text>
  <text class="b" x="712" y="400">with its origin</text>
  <text class="m" x="712" y="440">offline runtime</text>
  <line class="flow" x1="640" y1="375" x2="686" y2="375" marker-end="url(#ah)"/>
  <line class="flow" x1="910" y1="375" x2="956" y2="375" marker-end="url(#ah)"/>

  <!-- 4 Reviewer -->
  <rect class="card" x="960" y="230" width="330" height="290" rx="10"/>
  <circle class="num-c" cx="988" cy="258" r="14"/><text class="num-t" x="988" y="263">4</text>
  <text class="eyebrow" x="1012" y="263">AGENT 2 · REVIEWER</text>
  <text class="hm" x="984" y="314">codex-1</text>
  <circle class="dot" cx="990" cy="356" r="4"/><text class="b" x="1006" y="362">Different model, fresh eyes</text>
  <circle class="dot" cx="990" cy="392" r="4"/><text class="b" x="1006" y="398">Reviews the pinned commit</text>
  <circle class="dot" cx="990" cy="428" r="4"/><text class="b" x="1006" y="434">Reports a verdict</text>
  <rect class="pill-ok" x="984" y="470" width="128" height="30" rx="15"/>
  <text class="pill-ok-t mid" x="1048" y="490">READY sha</text>
  <rect class="pill-w" x="1122" y="470" width="146" height="30" rx="15"/>
  <text class="pill-w-t mid" x="1195" y="490">BLOCKED sha</text>

  <!-- 5 Merge gate -->
  <text class="ok-t mid" x="1320" y="362">READY</text>
  <line class="flow" x1="1290" y1="375" x2="1346" y2="375" marker-end="url(#ah)"/>
  <rect class="op" x="1350" y="230" width="190" height="290" rx="10"/>
  <circle class="num-op" cx="1378" cy="258" r="14"/><text class="num-op-t" x="1378" y="263">5</text>
  <path class="icon-op" d="M1434 290 l11 0 M1445 282 v28 M1468 290 h11 M1452 310 h-14 M1456 334 h-36 M1445 310 v24"/>
  <path class="icon-op" d="M1425 296 l7 0 -3.5 -8 z M1462 296 l7 0 -3.5 -8 z"/>
  <text class="eyebrow on-op-muted" x="1370" y="378">HUMAN</text>
  <text class="h on-op" x="1370" y="406">Merge gate</text>
  <text class="b on-op-muted" x="1370" y="438">A verdict is evidence,</text>
  <text class="b on-op-muted" x="1370" y="462">not permission.</text>
  <text class="b on-op-muted" x="1370" y="486">Developer merges.</text>

  <!-- BLOCKED loop -->
  <path class="loop" d="M1195 520 V598 H475 V528" marker-end="url(#aw)"/>
  <text class="warn-t mid" x="835" y="630">BLOCKED sha: finding</text>
  <text class="cb mid" x="835" y="654">Builder fixes it, then asks for a focused recheck of the new commit</text>

  <!-- Guardrails -->
  <rect class="band" x="0" y="690" width="1600" height="210"/>
  <text class="eyebrow" x="60" y="728">GUARDRAILS AT EVERY STEP</text>

  <g transform="translate(60 752)">
    <rect class="icon" x="2" y="10" width="18" height="14" rx="2"/><path class="icon" d="M6 10 v-4 a5 5 0 0 1 10 0 v4"/>
    <text class="ch" x="34" y="22">Sandboxed agents</text>
    <text class="cb" x="0" y="54">Agents run in containers;</text>
    <text class="cb" x="0" y="76">the broker stays offline</text>
  </g>
  <g transform="translate(360 752)">
    <path class="icon" d="M11 2 L20 6 V13 C20 19 15 23 11 25 C7 23 2 19 2 13 V6 Z"/>
    <text class="ch" x="34" y="22">Peers are untrusted</text>
    <text class="cb" x="0" y="54">A peer's message can't widen</text>
    <text class="cb" x="0" y="76">authority or approve a merge</text>
  </g>
  <g transform="translate(660 752)">
    <circle class="icon" cx="11" cy="9" r="6"/><path class="icon" d="M11 15 V26"/>
    <text class="ch" x="34" y="22">Pinned verdicts</text>
    <text class="cb" x="0" y="54">A verdict covers one commit;</text>
    <text class="cb" x="0" y="76">if it moves, review it again</text>
  </g>
  <g transform="translate(960 752)">
    <rect class="icon" x="2" y="4" width="20" height="20" rx="3"/><path class="icon" d="M7 14 l4 4 l7 -8"/>
    <text class="ch" x="34" y="22">Checks stay explicit</text>
    <text class="cb" x="0" y="54">Lint, CodeScene and Trivy CVE</text>
    <text class="cb" x="0" y="76">scans run before handoff; failures</text>
    <text class="cb" x="0" y="98">are reported, never assumed</text>
  </g>
  <g transform="translate(1260 752)">
    <circle class="icon" cx="11" cy="8" r="6"/><path class="icon" d="M0 27 a11 9 0 0 1 22 0"/>
    <text class="ch" x="34" y="22">Developer decides</text>
    <text class="cb" x="0" y="54">Only the developer approves</text>
    <text class="cb" x="0" y="76">a merge or a publication</text>
  </g>
</svg></body></html>
