</defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#20252B}.title{font-size:38px;font-weight:700}.heading{font-size:27px;font-weight:700}.body{font-size:23px}.small{font-size:19px;fill:#4D555E}.label{font-size:21px;paint-order:stroke;stroke:white;stroke-width:7px;stroke-linejoin:round}</style>
<rect width="1600" height="900" fill="white"/>
<text x="40" y="58" class="title" text-anchor="start">pairtask</text>
<text x="40" y="98" class="body" text-anchor="start">Agents and your chat on one machine · a paired workspace on another</text>
<rect x="495" y="150" width="360" height="95" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="517" y="190" class="heading" text-anchor="start">You</text>
<text x="517" y="226" class="body" text-anchor="start">host terminals</text>
<rect x="30" y="275" width="1155" height="530" rx="4" fill="white" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<text x="55" y="314" class="heading" text-anchor="start">Your machine</text>
<rect x="55" y="335" width="400" height="450" rx="4" fill="white" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<text x="80" y="374" class="heading" text-anchor="start">workspace</text>
<text x="80" y="404" class="small" text-anchor="start">network by default</text>
<rect x="495" y="335" width="360" height="450" rx="4" fill="white" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<text x="520" y="374" class="heading" text-anchor="start">secured</text>
<text x="520" y="404" class="small" text-anchor="start">offline: no network</text>
<rect x="895" y="335" width="270" height="450" rx="4" fill="white" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<text x="920" y="374" class="heading" text-anchor="start">connector</text>
<text x="920" y="404" class="small" text-anchor="start">only with pairing on</text>
<rect x="80" y="415" width="350" height="95" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="102" y="455" class="heading" text-anchor="start">Agents</text>
<text x="102" y="491" class="body" text-anchor="start">Codex · Claude Code · Pi</text>
<rect x="520" y="415" width="310" height="95" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="542" y="455" class="heading" text-anchor="start">Operator chat</text>
<text x="542" y="491" class="body" text-anchor="start">pairtask chat</text>
<rect x="80" y="545" width="350" height="95" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="102" y="585" class="heading" text-anchor="start">Dashboard</text>
<text x="102" y="621" class="body" text-anchor="start">read-only status</text>
<rect x="520" y="545" width="310" height="95" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="542" y="585" class="heading" text-anchor="start">Broker</text>
<text x="542" y="621" class="body" text-anchor="start">messages · pairing</text>
<rect x="915" y="545" width="230" height="95" rx="4" fill="#F6F6F6" stroke="#888888" stroke-width="2"/>
<text x="937" y="585" class="heading" text-anchor="start">Relay</text>
<text x="937" y="621" class="body" text-anchor="start">holds no key</text>
<path d="M80 684 A175.0 14 0 0 1 430 684 V756 A175.0 14 0 0 1 80 756 Z" fill="#90EE90" stroke="#888888" stroke-width="2"/>
<ellipse cx="255.0" cy="684" rx="175.0" ry="14" fill="#90EE90" stroke="#888888" stroke-width="2"/>
<text x="102" y="718" class="heading" text-anchor="start">Projects · agent home</text>
<text x="102" y="750" class="body" text-anchor="start">survive upgrades</text>
<path d="M520 684 A155.0 14 0 0 1 830 684 V756 A155.0 14 0 0 1 520 756 Z" fill="#90EE90" stroke="#888888" stroke-width="2"/>
<ellipse cx="675.0" cy="684" rx="155.0" ry="14" fill="#90EE90" stroke="#888888" stroke-width="2"/>
<text x="542" y="718" class="heading" text-anchor="start">SQLite</text>
<text x="542" y="750" class="body" text-anchor="start">only the broker uses it</text>
<rect x="1290" y="275" width="280" height="530" rx="4" fill="white" stroke="#888888" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1315" y="314" class="heading" text-anchor="start">Another machine</text>
<rect x="1310" y="545" width="240" height="95" rx="4" fill="#ADD8E6" stroke="#888888" stroke-width="2"/>
<text x="1332" y="585" class="heading" text-anchor="start">Its broker</text>
<text x="1332" y="621" class="body" text-anchor="start">paired workspace</text>
