<path d="M745 245 V415" fill="none" stroke="#008080" stroke-width="3.5" marker-end="url(#you)"/>
<text x="765" y="322" class="label" text-anchor="start">pairtask chat</text>
<path d="M430 462 H470 V575 H520" fill="none" stroke="#58A824" stroke-width="3.5" marker-end="url(#message)"/>
<text x="485" y="530" class="label" text-anchor="start">broker.sock</text>
<path d="M430 605 H520" fill="none" stroke="#58A824" stroke-width="3.5" marker-end="url(#message)"/>
<text x="475" y="597" class="label" text-anchor="middle">status</text>
<rect x="512" y="567" width="16" height="16" fill="#F4B6D2" stroke="#888888" stroke-width="2"/>
<rect x="512" y="597" width="16" height="16" fill="#F4B6D2" stroke="#888888" stroke-width="2"/>
<path d="M675 510 V545" fill="none" stroke="#008080" stroke-width="3.5" marker-end="url(#you)"/>
<text x="695" y="534" class="label" text-anchor="start">operator socket</text>
<path d="M675 640 V670" fill="none" stroke="#4B0082" stroke-width="3.5" marker-end="url(#storage)"/>
<text x="695" y="662" class="label" text-anchor="start">read / write</text>
<path d="M840 592 H915" fill="none" stroke="#8A2BE2" stroke-width="3.5" marker-end="url(#pairing)" marker-start="url(#pairing-start)"/>
<rect x="822" y="584" width="16" height="16" fill="#F4B6D2" stroke="#888888" stroke-width="2"/>
<path d="M1145 592 H1310" fill="none" stroke="#8A2BE2" stroke-width="3.5" marker-end="url(#pairing)" marker-start="url(#pairing-start)"/>
<text x="1227" y="577" class="label" text-anchor="middle">TCP 7445</text>
<text x="1227" y="622" class="label" text-anchor="middle">LAN or tailnet</text>
<path d="M40 825 H80" fill="none" stroke="#008080" stroke-width="3.5" marker-end="url(#you)"/>
<text x="92" y="832" class="small" text-anchor="start">you, through a terminal</text>
<path d="M358 825 H398" fill="none" stroke="#58A824" stroke-width="3.5" marker-end="url(#message)"/>
<text x="410" y="832" class="small" text-anchor="start">messages through the broker</text>
<path d="M716 825 H756" fill="none" stroke="#8A2BE2" stroke-width="3.5" marker-end="url(#pairing)"/>
<text x="768" y="832" class="small" text-anchor="start">pairing between workspaces</text>
<path d="M1064 825 H1104" fill="none" stroke="#4B0082" stroke-width="3.5" marker-end="url(#storage)"/>
<text x="1116" y="832" class="small" text-anchor="start">storage</text>
<rect x="1234" y="817" width="16" height="16" fill="#F4B6D2" stroke="#888888" stroke-width="2"/>
<text x="1274" y="832" class="small" text-anchor="start">shared socket</text>
<text x="40" y="862" class="small" text-anchor="start">Pairing runs TLS end to end between the brokers, pinned to each workspace&#x27;s identity key;</text>
<text x="40" y="884" class="small" text-anchor="start">the relay forwards sealed connections and sees no content.</text>
