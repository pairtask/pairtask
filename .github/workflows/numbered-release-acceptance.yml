name: Installed Box numbering acceptance
on:
  push:
    branches: [test/installed-box-numbering]
permissions:
  contents: read
jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FIRST_RELEASE: workspace-v0.0.0-build.1160.1
      SECOND_RELEASE: workspace-v0.0.0-build.1166.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4
        with:
          tofu_version: '1.12.6'
          tofu_wrapper: false
      - name: Initialize disposable Incus host
        run: sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT bash scripts/ci-incus.sh
      - name: Install, upgrade and verify release images on the same Box
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in "$FIRST_RELEASE" "$SECOND_RELEASE"; do
            git rev-parse --verify "refs/tags/$tag^{commit}"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern 'collab-ai-workspace-linux-amd64.*' --dir "$RUNNER_TEMP/$tag"
          done
          sudo --preserve-env=PATH,GH_TOKEN,RUNNER_TEMP,FIRST_RELEASE,SECOND_RELEASE bash scripts/ci-box-numbering-acceptance.sh </dev/null
